<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JL Advisory — Semiconductor Manufacturing Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1520;font-family:Georgia,serif;overflow:hidden;}
#wrap{width:100vw;height:100vh;position:relative;}
canvas{display:block;}
#yr-panel{position:absolute;top:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
#yr-label{font:600 10px Georgia,serif;letter-spacing:.25em;text-transform:uppercase;color:#C9A84C;margin-bottom:3px;}
#yr-num{font:300 64px/1 Georgia,serif;color:#fff;letter-spacing:-.02em;transition:color .3s;}
#yr-num.pop{color:#C9A84C;}
#yr-sub{font:400 11px Georgia,serif;color:rgba(255,255,255,0.3);letter-spacing:.08em;margin-top:3px;}
#cap-box{position:absolute;top:14px;right:16px;background:rgba(28,53,87,0.85);border:1px solid rgba(201,168,76,0.3);border-radius:8px;padding:12px 16px;min-width:160px;backdrop-filter:blur(4px);}
#cap-title{font:600 8px Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:9px;}
#cap-footer{border-top:1px solid rgba(201,168,76,0.2);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;align-items:center;}
#cap-footer-label{font:600 8px Georgia,serif;color:rgba(255,255,255,0.4);letter-spacing:.05em;}
#cap-total{font:700 14px Georgia,serif;color:#C9A84C;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="yr-panel">
    <div id="yr-label">Active Fabs</div>
    <div id="yr-num">2020</div>
    <div id="yr-sub">162 facilities worldwide</div>
  </div>
  <div id="cap-box">
    <div id="cap-title">Max Capacity</div>
    <div id="cap-rows"></div>
    <div id="cap-footer">
      <span id="cap-footer-label">GLOBAL TOTAL</span>
      <span id="cap-total">—</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const CO=[
  {n:'China',    f:'🇨🇳',lng:104, lat:35  },
  {n:'Taiwan',   f:'🇹🇼',lng:121, lat:23.5},
  {n:'USA',      f:'🇺🇸',lng:-98, lat:38  },
  {n:'S.Korea',  f:'🇰🇷',lng:127, lat:37  },
  {n:'Japan',    f:'🇯🇵',lng:138, lat:36  },
  {n:'Europe',   f:'🇪🇺',lng:15,  lat:50  },
  {n:'Singapore',f:'🇸🇬',lng:103, lat:1.3 },
  {n:'Malaysia', f:'🇲🇾',lng:110, lat:4   },
  {n:'Israel',   f:'🇮🇱',lng:35,  lat:31  },
  {n:'Other',    f:'🌐', lng:-58, lat:-15 },
];
const YD={
  2020:[42,38,18,22,16,12,4,3,2,5],
  2021:[46,39,19,23,16,12,4,3,2,5],
  2022:[51,40,20,24,17,13,5,3,2,6],
  2023:[58,41,21,24,18,13,5,4,2,6],
  2024:[64,43,24,25,20,15,5,4,2,7],
  2025:[70,45,27,26,22,16,6,4,2,8],
  2026:[75,47,30,27,23,18,6,5,3,9],
};
const CAP={
  2020:[55,42,28,28,20,16,6,5,3,7],
  2021:[62,44,30,29,21,17,6,5,3,7],
  2022:[72,46,35,31,22,18,7,5,3,8],
  2023:[85,48,40,32,24,20,7,6,3,9],
  2024:[100,52,48,34,27,24,8,6,4,10],
  2025:[118,56,58,36,30,28,9,7,4,11],
  2026:[135,60,68,38,32,32,10,8,5,12],
};
const YRS=[2020,2021,2022,2023,2024,2025,2026];
const G='#1a5c2a';

const wrap=document.getElementById('wrap');
let W=window.innerWidth,H=window.innerHeight;
const cv=document.getElementById('cv');
cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';
const ctx=cv.getContext('2d');ctx.scale(2,2);

const MAX_BAR=H*0.52;
let curYear=2020,curH=CO.map(()=>0),tgtH=CO.map(()=>0),world=null;

function toScreen(lng,lat){
  const nx=(lng+180)/360,ny=1-(lat+90)/180;
  const pad=W*0.04,mapW=W-pad*2,mapH=H*0.36,mapTop=H*0.52;
  const perspW=mapW*(0.50+ny*0.50),offsetX=(mapW-perspW)/2;
  return[pad+offsetX+nx*perspW,mapTop+ny*mapH];
}
function shade(hex,f){const n=parseInt(hex.replace('#',''),16);return`rgb(${Math.min(255,((n>>16)&255)*f)|0},${Math.min(255,((n>>8)&255)*f)|0},${Math.min(255,(n&255)*f)|0})`;}
function drawPoly(ring,fill,stroke,lw){
  if(!ring||ring.length<3)return;
  ctx.beginPath();let first=true,pnx=-1;
  for(const[lng,lat]of ring){const nx=(lng+180)/360;if(!first&&Math.abs(nx-pnx)>0.5){first=true;}const[sx,sy]=toScreen(lng,lat);first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);first=false;pnx=nx;}
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}

function updateCapBox(y){
  const active=YD[y],cap=CAP[y];
  const ranked=CO.map((co,i)=>({co,act:active[i],cap:cap[i],pct:Math.round(active[i]/cap[i]*100)}))
    .sort((a,b)=>b.cap-a.cap).slice(0,5);
  document.getElementById('cap-rows').innerHTML=ranked.map(({co,cap,pct})=>`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;">
      <span style="font:400 10px Georgia,serif;color:rgba(255,255,255,0.7);white-space:nowrap;">${co.f} ${co.n}</span>
      <div style="display:flex;align-items:center;gap:5px;">
        <div style="width:44px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:#1a5c2a;border-radius:3px;transition:width .6s;"></div>
        </div>
        <span style="font:700 10px Georgia,serif;color:#C9A84C;min-width:26px;text-align:right;">${cap}</span>
      </div>
    </div>`).join('');
  document.getElementById('cap-total').textContent=cap.reduce((a,b)=>a+b,0);
}

function frame(){
  requestAnimationFrame(frame);
  curH=curH.map((h,i)=>h+(tgtH[i]-h)*0.06);
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1520';ctx.fillRect(0,0,W,H);
  const TL=toScreen(-180,90),TR=toScreen(180,90),BR=toScreen(180,-90),BL=toScreen(-180,-90);
  ctx.beginPath();ctx.moveTo(TL[0],TL[1]);ctx.lineTo(TR[0],TR[1]);ctx.lineTo(BR[0],BR[1]);ctx.lineTo(BL[0],BL[1]);ctx.closePath();
  ctx.fillStyle='#1C3557';ctx.fill();
  if(world){
    const countries=topojson.feature(world,world.objects.countries);
    const borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
    countries.features.forEach(f=>{try{const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;ps.forEach(poly=>poly.forEach((ring,ri)=>drawPoly(ring,ri===0?'#C9A84C':'#1C3557',null,0)));}catch(e){}});
    if(borders.type==='MultiLineString')borders.coordinates.forEach(line=>{if(!line||line.length<2)return;ctx.beginPath();let first=true,pnx=-1;for(const[lng,lat]of line){const nx=(lng+180)/360;if(!first&&Math.abs(nx-pnx)>0.5){first=true;}const[sx,sy]=toScreen(lng,lat);first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);first=false;pnx=nx;}ctx.strokeStyle='rgba(15,35,60,0.8)';ctx.lineWidth=0.5;ctx.stroke();});
    countries.features.forEach(f=>{try{const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;ps.forEach(poly=>drawPoly(poly[0],null,'rgba(255,200,80,0.3)',0.5));}catch(e){}});
  }
  ctx.beginPath();ctx.moveTo(TL[0],TL[1]);ctx.lineTo(TR[0],TR[1]);ctx.lineTo(BR[0],BR[1]);ctx.lineTo(BL[0],BL[1]);ctx.closePath();
  ctx.strokeStyle='rgba(201,168,76,0.2)';ctx.lineWidth=1;ctx.stroke();
  const sorted=[...CO.map((co,i)=>({co,i}))].sort((a,b)=>b.co.lat-a.co.lat);
  sorted.forEach(({co,i})=>{
    const h=curH[i]*MAX_BAR;if(h<1)return;
    const[bx,by]=toScreen(co.lng,co.lat),ty=by-h;
    const hw=Math.max(4,W*0.006),dz=hw*0.6,dzv=dz*0.35;
    ctx.fillStyle=shade(G,0.52);ctx.beginPath();ctx.moveTo(bx+hw,by);ctx.lineTo(bx+hw+dz,by-dzv);ctx.lineTo(bx+hw+dz,ty-dzv);ctx.lineTo(bx+hw,ty);ctx.closePath();ctx.fill();
    const gr=ctx.createLinearGradient(0,by,0,ty);gr.addColorStop(0,'rgba(26,92,42,0.95)');gr.addColorStop(1,'rgba(26,92,42,0.35)');
    ctx.fillStyle=gr;ctx.fillRect(bx-hw,ty,hw*2,h);
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(bx-hw,ty,hw*0.18,h);
    ctx.fillStyle=shade(G,1.4);ctx.beginPath();ctx.moveTo(bx-hw,ty);ctx.lineTo(bx+hw,ty);ctx.lineTo(bx+hw+dz,ty-dzv);ctx.lineTo(bx-hw+dz,ty-dzv);ctx.closePath();ctx.fill();
    const pg=ctx.createRadialGradient(bx,by,0,bx,by,hw*5);pg.addColorStop(0,'rgba(26,92,42,0.3)');pg.addColorStop(1,'rgba(26,92,42,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(bx,by,hw*5,hw*1.8,0,0,Math.PI*2);ctx.fill();
  });
  sorted.forEach(({co,i})=>{
    const h=curH[i]*MAX_BAR;
    const[bx,by]=toScreen(co.lng,co.lat);
    ctx.textAlign='center';
    ctx.font=`700 ${Math.max(9,W*0.011)}px Georgia,serif`;ctx.fillStyle='rgba(255,255,255,0.9)';ctx.globalAlpha=1;
    ctx.fillText(YD[curYear][i],bx,by-h-5);
    const fs=Math.max(14,W*0.02);ctx.font=`${fs}px serif`;ctx.fillText(co.f,bx,by+fs+2);
    ctx.font=`400 ${Math.max(8,W*0.010)}px Georgia,serif`;ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.fillText(co.n,bx,by+fs*2+2);
    ctx.globalAlpha=1;ctx.textAlign='left';
  });
}

function setYear(y){
  curYear=y;
  const el=document.getElementById('yr-num');
  el.classList.add('pop');setTimeout(()=>{el.textContent=y;el.classList.remove('pop');},150);
  document.getElementById('yr-sub').textContent=YD[y].reduce((a,b)=>a+b,0)+' facilities worldwide';
  const mx=Math.max(...YD[y]);tgtH=YD[y].map(v=>Math.max(0.02,v/mx));
  updateCapBox(y);
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r=>r.json()).then(d=>{world=d;});
setYear(2020);let pi=0;
setInterval(()=>{pi=(pi+1)%YRS.length;setYear(YRS[pi]);},1800);
frame();
</script>
</body>
</html>
