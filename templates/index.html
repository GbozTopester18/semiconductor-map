<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Semiconductor Manufacturing · 2020–2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a; --panel: #0f1526; --border: #1e2d4a;
    --text: #e2e8f7; --muted: #6b7fa8;
    --accent: #00d4ff; --accent2: #ff6b35; --accent3: #00ff88;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
    background-size:60px 60px; pointer-events:none; z-index:0;
  }
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; background:white; border-radius:50%; animation:twinkle var(--d) ease-in-out infinite; opacity:0; }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--o)} }

  .app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; padding:12px; gap:10px; }

  header {
    display:flex; align-items:center; justify-content:space-between; padding:8px 16px;
    background:rgba(15,21,38,0.9); border:1px solid var(--border); border-radius:8px;
    backdrop-filter:blur(10px); flex-shrink:0; gap:12px; flex-wrap:wrap;
  }
  .header-left { display:flex; align-items:center; gap:16px; }
  .logo { font-family:'Space Mono',monospace; font-size:11px; color:var(--accent); letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-size:15px; font-weight:800; letter-spacing:.05em; }
  h1 span { color:var(--accent); }
  .year-display {
    font-family:'Space Mono',monospace; font-size:42px; font-weight:700; color:var(--accent);
    text-shadow:0 0 30px rgba(0,212,255,.5),0 0 60px rgba(0,212,255,.2);
    letter-spacing:.05em; line-height:1; transition:all .3s;
  }
  .year-display.changing { transform:scale(1.15); color:#fff; }

  .header-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  .filter-group { display:flex; gap:4px; }
  .filter-btn {
    padding:4px 10px; border-radius:20px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-family:'Space Mono',monospace;
    font-size:10px; cursor:pointer; transition:all .2s; letter-spacing:.04em;
  }
  .filter-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  .filter-btn.active { background:rgba(255,107,53,.15); border-color:var(--accent2); color:var(--accent2); font-weight:700; }

  .cat-btn:hover { border-color:var(--accent); color:var(--accent); }
  .cat-btn.active { background:rgba(0,212,255,.1); border-color:var(--accent); color:var(--accent); }
  .cat-btn.memory.active { background:rgba(108,92,231,.2); border-color:#6c5ce7; color:#6c5ce7; }
  .cat-btn.osat.active { background:rgba(0,255,136,.1); border-color:var(--accent3); color:var(--accent3); }

  .admin-link {
    padding:5px 12px; border-radius:6px; border:1px solid var(--accent2);
    background:rgba(255,107,53,.1); color:var(--accent2); font-family:'Space Mono',monospace;
    font-size:10px; cursor:pointer; text-decoration:none; transition:all .2s;
  }
  .admin-link:hover { background:rgba(255,107,53,.2); }

  .main { display:flex; gap:10px; flex:1; overflow:hidden; min-height:0; }

  .sidebar {
    width:190px; flex-shrink:0; background:rgba(15,21,38,.9); border:1px solid var(--border);
    border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px;
    overflow-y:auto; backdrop-filter:blur(10px);
  }
  .sidebar-title {
    font-family:'Space Mono',monospace; font-size:9px; color:var(--accent2);
    letter-spacing:.2em; text-transform:uppercase; margin-bottom:6px;
    padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .legend-item { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:4px; transition:all .2s; }
  .legend-item.dimmed { opacity:.3; }
  .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .legend-name { font-weight:600; font-size:11px; }
  .legend-sub { font-size:9px; color:var(--muted); font-family:'Space Mono',monospace; }

  .map-container {
    flex:1; position:relative; background:rgba(15,21,38,.9); border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
  }
  .map-container::after {
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 1px,transparent 1px,transparent 3px);
    pointer-events:none; z-index:5;
  }
  #map { width:100%; height:100%; transition:all .6s cubic-bezier(.4,0,.2,1); }
  .land { fill:#1a2a3a; stroke:#2a3d55; stroke-width:.5; }

  .progress-bar {
    position:absolute; top:0; left:0; height:2px; background:var(--accent);
    transition:width .1s linear; box-shadow:0 0 8px var(--accent); z-index:20; border-radius:0 2px 2px 0;
  }
  .count-badge {
    position:absolute; top:8px; right:8px; background:rgba(0,212,255,.1);
    border:1px solid rgba(0,212,255,.3); border-radius:20px; padding:3px 10px;
    font-family:'Space Mono',monospace; font-size:10px; color:var(--accent); z-index:10;
  }
  .region-label {
    position:absolute; font-family:'Space Mono',monospace; font-size:9px;
    color:rgba(0,212,255,.25); letter-spacing:.2em; text-transform:uppercase; pointer-events:none;
  }

  .fab-marker { position:absolute; transform:translate(-50%,-50%); cursor:pointer; z-index:10; }
  @keyframes markerEnter { from{transform:translate(-50%,-50%) scale(0);opacity:0} to{transform:translate(-50%,-50%) scale(1);opacity:1} }
  @keyframes markerExit  { from{transform:translate(-50%,-50%) scale(1);opacity:1} to{transform:translate(-50%,-50%) scale(0);opacity:0} }
  .fab-marker.entering { animation:markerEnter .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .fab-marker.exiting  { animation:markerExit .3s ease forwards; }
  .fab-dot {
    border-radius:50%; border:2px solid rgba(255,255,255,.3);
    position:relative; transition:all .3s; display:flex; align-items:center; justify-content:center;
  }
  .fab-dot::before {
    content:''; position:absolute; inset:-4px; border-radius:50%;
    border:1px solid currentColor; opacity:.3; animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.3} 50%{transform:scale(1.4);opacity:0} }
  .fab-marker:hover .fab-dot { transform:scale(1.5); }
  .fab-label {
    position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    white-space:nowrap; background:rgba(10,14,26,.95); border:1px solid var(--border);
    border-radius:4px; padding:3px 7px; font-size:9px; font-family:'Space Mono',monospace;
    pointer-events:none; opacity:0; transition:opacity .2s; z-index:20; margin-bottom:4px;
  }
  .fab-marker:hover .fab-label { opacity:1; }
  .fab-node {
    font-family:'Space Mono',monospace; font-weight:700; text-align:center; line-height:1;
    position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
    white-space:nowrap; opacity:.8;
  }

  .right-panel { width:210px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; }
  .stats-box {
    background:rgba(15,21,38,.9); border:1px solid var(--border); border-radius:8px;
    padding:12px; backdrop-filter:blur(10px);
  }
  .stats-title { font-family:'Space Mono',monospace; font-size:9px; color:var(--accent2); letter-spacing:.2em; text-transform:uppercase; margin-bottom:10px; }
  .stat-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:11px; }
  .stat-row:last-child { border-bottom:none; }
  .stat-label { color:var(--muted); font-family:'Space Mono',monospace; }
  .stat-val { font-weight:700; color:var(--accent); font-family:'Space Mono',monospace; }
  .node-timeline { flex:1; overflow-y:auto; }
  .node-entry { padding:6px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  .node-entry:last-child { border-bottom:none; }
  .node-company { font-size:11px; font-weight:700; margin-bottom:2px; }
  .node-info { font-size:10px; color:var(--muted); font-family:'Space Mono',monospace; }

  .controls {
    background:rgba(15,21,38,.9); border:1px solid var(--border); border-radius:8px;
    padding:10px 16px; display:flex; align-items:center; gap:16px; flex-shrink:0;
  }
  .year-track { flex:1; display:flex; }
  .year-btn {
    flex:1; padding:8px 4px; background:transparent; border:1px solid var(--border);
    color:var(--muted); font-family:'Space Mono',monospace; font-size:11px; cursor:pointer; transition:all .2s;
  }
  .year-btn:first-child { border-radius:6px 0 0 6px; }
  .year-btn:last-child  { border-radius:0 6px 6px 0; }
  .year-btn:not(:first-child) { border-left:none; }
  .year-btn:hover { background:rgba(0,212,255,.08); color:var(--accent); }
  .year-btn.active { background:rgba(0,212,255,.15); color:var(--accent); border-color:var(--accent); font-weight:700; z-index:1; }
  .play-btn {
    width:42px; height:42px; border-radius:50%; background:var(--accent); border:none;
    color:var(--bg); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .2s; flex-shrink:0; box-shadow:0 0 20px rgba(0,212,255,.3);
  }
  .play-btn:hover { transform:scale(1.1); box-shadow:0 0 30px rgba(0,212,255,.5); }

  .tooltip {
    position:fixed; background:rgba(10,14,26,.97); border:1px solid var(--accent);
    border-radius:8px; padding:10px 14px; font-size:12px; pointer-events:none;
    z-index:100; opacity:0; transition:opacity .2s; min-width:160px; backdrop-filter:blur(10px);
  }
  .tooltip.show { opacity:1; }
  .tooltip-company { font-weight:800; font-size:13px; margin-bottom:4px; }
  .tooltip-loc { color:var(--muted); font-family:'Space Mono',monospace; font-size:10px; margin-bottom:2px; }
  .tooltip-node { color:var(--accent); font-family:'Space Mono',monospace; font-size:11px; font-weight:700; }
  .tooltip-type { font-size:10px; margin-top:4px; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  #loadingOverlay {
    position:fixed; inset:0; background:var(--bg); z-index:999;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; transition:opacity .5s;
  }
  #loadingOverlay.hide { opacity:0; pointer-events:none; }
  .loading-text { font-family:'Space Mono',monospace; color:var(--accent); font-size:13px; letter-spacing:.2em; }
  .loading-bar { width:200px; height:2px; background:var(--border); border-radius:2px; overflow:hidden; }
  .loading-fill { height:100%; background:var(--accent); animation:loadFill 1s ease forwards; box-shadow:0 0 8px var(--accent); }
  @keyframes loadFill { from{width:0} to{width:100%} }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loading-text">LOADING SEMICONDUCTOR DATA</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<div class="stars" id="stars"></div>

<div class="app">
  <header>
    <div class="header-left">
      <div class="logo">JL Advisory</div>
      <h1>Global Semiconductor <span>Footprint</span></h1>
    </div>
    <div class="year-display" id="yearDisplay">—</div>
    <div class="header-right">
      <!-- Region zoom -->
      <div class="filter-group">
        <button class="filter-btn active" id="rzoom-all"      onclick="setRegion('all')">🌍 World</button>
        <button class="filter-btn"        id="rzoom-americas" onclick="setRegion('americas')">Americas</button>
        <button class="filter-btn"        id="rzoom-europe"   onclick="setRegion('europe')">Europe / ME</button>
        <button class="filter-btn"        id="rzoom-asia"     onclick="setRegion('asia')">Asia Pacific</button>
      </div>
      <!-- Category -->
      <div class="filter-group">
        <button class="filter-btn cat-btn foundry active" onclick="toggleCat('foundry')">Foundry</button>
        <button class="filter-btn cat-btn memory  active" onclick="toggleCat('memory')">Memory</button>
        <button class="filter-btn cat-btn osat    active" onclick="toggleCat('osat')">OSAT</button>
      </div>
      <a href="/admin" class="admin-link">⚙ Edit Data</a>
    </div>
  </header>

  <div class="main">
    <div class="sidebar" id="sidebar"></div>

    <div class="map-container">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
      <div class="count-badge" id="countBadge">Loading…</div>
      <div id="mapArea" style="position:relative;width:100%;height:100%;">
        <svg id="map" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <rect width="1000" height="500" fill="#0a1220"/>
          <path class="land" d="M 50 80 L 85 70 L 120 60 L 155 65 L 180 75 L 200 85 L 215 95 L 225 110 L 220 130 L 210 150 L 195 165 L 185 180 L 175 200 L 170 225 L 165 245 L 155 255 L 145 260 L 130 255 L 115 245 L 100 230 L 90 210 L 80 190 L 70 170 L 60 150 L 52 130 L 48 110 Z"/>
          <path class="land" d="M 155 265 L 175 255 L 195 260 L 210 270 L 220 290 L 225 315 L 220 340 L 210 360 L 195 380 L 180 400 L 165 415 L 150 420 L 138 410 L 130 390 L 125 365 L 125 340 L 128 315 L 133 290 L 140 270 Z"/>
          <path class="land" d="M 430 60 L 460 55 L 490 58 L 510 65 L 520 80 L 515 95 L 500 105 L 480 110 L 460 108 L 440 100 L 425 88 L 422 75 Z"/>
          <path class="land" d="M 455 30 L 475 25 L 490 35 L 488 50 L 475 55 L 460 52 L 452 42 Z"/>
          <path class="land" d="M 440 120 L 470 110 L 500 115 L 520 130 L 530 155 L 528 185 L 520 215 L 510 245 L 495 270 L 478 290 L 460 300 L 442 295 L 428 275 L 418 250 L 412 220 L 412 190 L 415 160 L 422 135 Z"/>
          <path class="land" d="M 525 100 L 560 95 L 590 100 L 605 115 L 600 135 L 580 145 L 555 140 L 535 130 L 522 118 Z"/>
          <path class="land" d="M 520 30 L 580 20 L 650 18 L 720 22 L 780 28 L 840 35 L 880 45 L 900 60 L 890 80 L 860 90 L 820 95 L 770 95 L 720 90 L 670 88 L 620 85 L 575 82 L 540 75 L 522 62 Z"/>
          <path class="land" d="M 605 120 L 640 115 L 665 125 L 675 150 L 665 175 L 645 195 L 620 200 L 600 188 L 590 165 L 592 140 Z"/>
          <path class="land" d="M 680 140 L 720 130 L 750 138 L 760 155 L 745 170 L 720 172 L 695 162 L 678 150 Z"/>
          <path class="land" d="M 660 70 L 720 58 L 780 60 L 820 75 L 840 95 L 835 120 L 815 140 L 785 150 L 750 148 L 720 140 L 690 132 L 665 120 L 655 100 Z"/>
          <path class="land" d="M 820 80 L 845 75 L 865 82 L 870 98 L 855 108 L 835 105 L 820 95 Z"/>
          <path class="land" d="M 875 70 L 895 65 L 910 72 L 912 90 L 900 100 L 882 98 L 872 85 Z"/>
          <ellipse class="land" cx="840" cy="155" rx="10" ry="15"/>
          <path class="land" d="M 760 280 L 820 265 L 875 270 L 910 290 L 920 320 L 910 350 L 885 370 L 850 375 L 815 365 L 785 345 L 768 320 L 762 295 Z"/>
          <ellipse class="land" cx="755" cy="190" rx="8" ry="6"/>
          <line x1="0" y1="250" x2="1000" y2="250" stroke="rgba(0,212,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
          <line x1="500" y1="0" x2="500" y2="500" stroke="rgba(0,212,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
        </svg>
        <div class="region-label" style="left:8%;top:30%">Americas</div>
        <div class="region-label" style="left:42%;top:12%">Europe / ME</div>
        <div class="region-label" style="left:70%;top:10%">Asia Pacific</div>
        <div id="fabLayer" style="position:absolute;inset:0;"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="stats-box">
        <div class="stats-title">Year Stats</div>
        <div class="stat-row"><span class="stat-label">Total Fabs</span><span class="stat-val" id="statTotal">—</span></div>
        <div class="stat-row"><span class="stat-label">Foundry</span><span class="stat-val" id="statFoundry">—</span></div>
        <div class="stat-row"><span class="stat-label">Memory</span><span class="stat-val" id="statMemory">—</span></div>
        <div class="stat-row"><span class="stat-label">OSAT</span><span class="stat-val" id="statOsat">—</span></div>
        <div class="stat-row"><span class="stat-label">Leading Node</span><span class="stat-val" id="statLeading">—</span></div>
        <div class="stat-row"><span class="stat-label">New This Year</span><span class="stat-val" id="statNew" style="color:var(--accent3)">—</span></div>
      </div>
      <div class="node-timeline stats-box">
        <div class="stats-title">Milestones</div>
        <div id="milestoneList"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <div class="year-track" id="yearTrack"></div>
    <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)">Click year or ▶ to animate</div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-company" id="tt-company"></div>
  <div class="tooltip-loc" id="tt-loc"></div>
  <div class="tooltip-node" id="tt-node"></div>
  <div class="tooltip-type" id="tt-type"></div>
</div>

<script>
let DB = null;
let currentYear = 2020;
let currentRegion = 'all';
let activeCats = { foundry: true, memory: true, osat: true };
let playInterval = null;
let isPlaying = false;

const REGION_VIEWS = {
  all:      '0 0 1000 500',
  americas: '30 55 230 230',
  europe:   '400 10 250 170',
  asia:     '630 10 320 260',
};
const REGION_BOUNDS = {
  all:      { x1:0,  x2:100, y1:0,  y2:100 },
  americas: { x1:3,  x2:26,  y1:11, y2:57  },
  europe:   { x1:40, x2:65,  y1:2,  y2:36  },
  asia:     { x1:63, x2:95,  y1:2,  y2:54  },
};
const REGION_LOC = {
  all:      () => true,
  americas: l => ['Oregon','Arizona','Boise','Malta','Chaska','Purdue','Taylor'].some(k=>l.startsWith(k)),
  europe:   l => ['Dresden','Crolles','Magdeburg','Kiryat'].some(k=>l.startsWith(k)),
  asia:     l => ['Taiwan','Tainan','Hsinchu','Kaohsiung','Hwaseong','Icheon','Cheongju','Kumamoto','Hiroshima','Saijo','Beijing','Shanghai','Shenzhen','HeJian','Wuhan','Hefei','Chengdu','Wuxi','Singapore','China'].some(k=>l.startsWith(k)),
};

// ── bootstrap ────────────────────────────────────────────────────────────────
async function boot() {
  createStars();
  const res = await fetch('/api/data');
  DB = await res.json();
  buildLegend();
  buildYearButtons();
  renderYear(currentYear);
  document.getElementById('loadingOverlay').classList.add('hide');
}

// ── stars ─────────────────────────────────────────────────────────────────────
function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random()*2+.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${2+Math.random()*4}s;--o:${.3+Math.random()*.5};animation-delay:${Math.random()*4}s`;
    c.appendChild(s);
  }
}

// ── legend ────────────────────────────────────────────────────────────────────
function buildLegend() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const cats = { foundry: [], memory: [], osat: [] };
  for (const [id, c] of Object.entries(DB.companies)) cats[c.cat]?.push([id, c]);
  for (const [cat, items] of Object.entries(cats)) {
    if (!items.length) continue;
    const sec = document.createElement('div');
    sec.innerHTML = `<div class="sidebar-title">${cat.charAt(0).toUpperCase()+cat.slice(1)}</div>`;
    items.forEach(([id, c]) => {
      const d = document.createElement('div');
      d.className = 'legend-item'; d.id = `leg-${id}`;
      d.innerHTML = `<div class="legend-dot" style="background:${c.color};box-shadow:0 0 6px ${c.color}40;"></div>
        <div><div class="legend-name">${c.full}</div><div class="legend-sub">${c.origin}</div></div>`;
      sec.appendChild(d);
    });
    sidebar.appendChild(sec);
  }
}

// ── year buttons ──────────────────────────────────────────────────────────────
function buildYearButtons() {
  const years = getYears();
  const track = document.getElementById('yearTrack');
  track.innerHTML = '';
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-btn' + (y === currentYear ? ' active' : '');
    btn.textContent = y; btn.id = `ybtn-${y}`;
    btn.onclick = () => setYear(y);
    track.appendChild(btn);
  });
}

function getYears() {
  const ys = new Set();
  DB.fabs.forEach(f => Object.keys(f.years).forEach(y => ys.add(parseInt(y))));
  return Array.from(ys).sort();
}

// ── year change ───────────────────────────────────────────────────────────────
function setYear(year) {
  const prev = currentYear;
  currentYear = year;
  const yd = document.getElementById('yearDisplay');
  yd.classList.add('changing'); yd.textContent = year;
  setTimeout(() => yd.classList.remove('changing'), 300);
  getYears().forEach(y => document.getElementById(`ybtn-${y}`)?.classList.toggle('active', y===year));
  const years = getYears();
  document.getElementById('progressBar').style.width = `${(years.indexOf(year)/(years.length-1))*100}%`;
  renderYear(year, prev);
}

// ── render ────────────────────────────────────────────────────────────────────
function toZoomed(coords) {
  if (currentRegion === 'all') return coords;
  const b = REGION_BOUNDS[currentRegion];
  return [
    Math.max(-5, Math.min(105, ((coords[0]-b.x1)/(b.x2-b.x1))*100)),
    Math.max(-5, Math.min(105, ((coords[1]-b.y1)/(b.y2-b.y1))*100)),
  ];
}

function renderYear(year, prevYear) {
  const layer = document.getElementById('fabLayer');
  const activeFabs = DB.fabs.filter(f => f.years[year] && activeCats[DB.companies[f.company]?.cat]);
  const prevIds = prevYear ? DB.fabs.filter(f=>f.years[prevYear]&&activeCats[DB.companies[f.company]?.cat]).map(f=>f.id) : [];

  // Remove exited fabs
  layer.querySelectorAll('.fab-marker').forEach(el => {
    if (!activeFabs.find(f=>f.id===el.dataset.fabId)) {
      el.classList.add('exiting');
      setTimeout(()=>el.remove(), 300);
    }
  });

  // Show/hide by region
  layer.querySelectorAll('.fab-marker').forEach(el => {
    const fab = DB.fabs.find(f=>f.id===el.dataset.fabId);
    el.style.display = fab && REGION_LOC[currentRegion](fab.loc) ? '' : 'none';
  });

  // Add/update
  const zoomScale = currentRegion === 'all' ? 1 : 1.8;
  activeFabs.filter(f=>REGION_LOC[currentRegion](f.loc)).forEach(fab => {
    const raw = DB.coords[fab.loc]; if (!raw) return;
    const pos = toZoomed(raw);
    const co = DB.companies[fab.company]; if (!co) return;
    const node = fab.years[year];
    const isNew = !prevIds.includes(fab.id);
    const dotSize = (co.cat==='foundry'?14:co.cat==='memory'?12:10)*zoomScale;
    const fsize   = currentRegion==='all'?7:9;

    let el = layer.querySelector(`[data-fab-id="${fab.id}"]`);
    if (!el) {
      el = document.createElement('div'); el.className='fab-marker'; el.dataset.fabId=fab.id;
      layer.appendChild(el);
      if (prevYear!==undefined) { el.classList.add('entering'); setTimeout(()=>el.classList.remove('entering'),500); }
    }
    el.style.display=''; el.style.left=`${pos[0]}%`; el.style.top=`${pos[1]}%`;
    el.innerHTML=`
      <div class="fab-dot" style="background:${co.color}30;border-color:${co.color};color:${co.color};width:${dotSize}px;height:${dotSize}px;box-shadow:0 0 8px ${co.color}60;">
        ${isNew&&prevYear?`<div style="position:absolute;inset:-3px;border-radius:50%;border:1px dashed ${co.color};animation:pulse 1s ease-in-out 3;"></div>`:''}
      </div>
      <div class="fab-label" style="border-color:${co.color}40;">
        <span style="color:${co.color};font-weight:700;">${fab.name}</span><br>
        <span style="color:#a0aec0;">${node}</span>
      </div>
      <div class="fab-node" style="color:${co.color};font-size:${fsize}px;">${node.split('/')[0]}</div>`;
    el.onmouseenter=e=>showTip(e,fab,co,node);
    el.onmousemove=e=>moveTip(e);
    el.onmouseleave=hideTip;
  });

  updateStats(year, activeFabs, prevIds);
  updateMilestones(year);
  updateLegendDim(activeFabs);
}

// ── stats & milestones ────────────────────────────────────────────────────────
function updateStats(year, fabs, prevIds) {
  const get = cat => fabs.filter(f=>DB.companies[f.company]?.cat===cat).length;
  document.getElementById('statTotal').textContent   = fabs.length;
  document.getElementById('statFoundry').textContent = get('foundry');
  document.getElementById('statMemory').textContent  = get('memory');
  document.getElementById('statOsat').textContent    = get('osat');
  const newCount = fabs.filter(f=>!prevIds.includes(f.id)).length;
  document.getElementById('statNew').textContent = newCount>0?`+${newCount}`:'—';
  document.getElementById('countBadge').textContent = `${fabs.length} fabs active`;
  const nodes = ['N2','3nm','4nm','5nm','7nm','10nm','14nm','Intel 3','Intel 4','Intel 18A'];
  const nodeLabels = {'N2':'2nm','3nm':'3nm','4nm':'4nm','5nm':'5nm','7nm':'7nm','10nm':'10nm','14nm':'14nm','Intel 3':'~3nm','Intel 4':'~4nm','Intel 18A':'~1.8nm'};
  for (const n of nodes) {
    if (fabs.some(f=>(f.years[year]||'').includes(n))) { document.getElementById('statLeading').textContent=nodeLabels[n]||n; break; }
  }
}

function updateMilestones(year) {
  const list = document.getElementById('milestoneList');
  list.innerHTML = '';
  (DB.milestones[year]||[]).forEach(m => {
    const d=document.createElement('div'); d.className='node-entry';
    d.innerHTML=`<div class="node-info" style="color:#a0d4ff;">▸ ${m}</div>`;
    list.appendChild(d);
  });
  DB.fabs.filter(f=>f.years[year]&&!f.years[year-1]).forEach(f=>{
    const co=DB.companies[f.company]; if(!co) return;
    const d=document.createElement('div'); d.className='node-entry';
    d.innerHTML=`<div class="node-company" style="color:${co.color}">🆕 ${f.name}</div><div class="node-info">${f.years[year]}</div>`;
    list.appendChild(d);
  });
}

function updateLegendDim(fabs) {
  const active = new Set(fabs.map(f=>f.company));
  document.querySelectorAll('.legend-item').forEach(el=>{
    el.classList.toggle('dimmed', !active.has(el.id.replace('leg-','')));
  });
}

// ── region zoom ───────────────────────────────────────────────────────────────
function setRegion(r) {
  currentRegion = r;
  document.getElementById('map').setAttribute('viewBox', REGION_VIEWS[r]);
  document.querySelectorAll('.filter-btn[id^="rzoom"]').forEach(b=>b.classList.remove('active'));
  document.getElementById(`rzoom-${r}`).classList.add('active');
  renderYear(currentYear);
}

// ── category toggle ───────────────────────────────────────────────────────────
function toggleCat(cat) {
  activeCats[cat] = !activeCats[cat];
  document.querySelector(`.cat-btn.${cat}`).classList.toggle('active', activeCats[cat]);
  renderYear(currentYear);
}

// ── playback ──────────────────────────────────────────────────────────────────
function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) {
    const years = getYears();
    if (currentYear === years[years.length-1]) setYear(years[0]);
    playInterval = setInterval(() => {
      const years = getYears(), idx = years.indexOf(currentYear);
      if (idx < years.length-1) setYear(years[idx+1]);
      else togglePlay();
    }, 1800);
  } else { clearInterval(playInterval); }
}

// ── tooltip ───────────────────────────────────────────────────────────────────
function showTip(e, fab, co, node) {
  const t=document.getElementById('tooltip');
  document.getElementById('tt-company').textContent=fab.name;
  document.getElementById('tt-company').style.color=co.color;
  document.getElementById('tt-loc').textContent=fab.loc.replace(/_/g,' ');
  document.getElementById('tt-node').textContent=node;
  document.getElementById('tt-type').textContent=co.cat.charAt(0).toUpperCase()+co.cat.slice(1)+' · '+co.origin;
  t.classList.add('show'); moveTip(e);
}
function moveTip(e) { const t=document.getElementById('tooltip'); t.style.left=`${e.clientX+12}px`; t.style.top=`${e.clientY-10}px`; }
function hideTip()  { document.getElementById('tooltip').classList.remove('show'); }

boot();
</script>
</body>
